<title>Iron House Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Changa:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-disp:"Barlow Condensed","Changa","IBM Plex Sans Arabic","Arial Narrow",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --slide:100%;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --bg:#eceef3; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dce0e8;
  --ink:#141922; --ink-2:#465063; --ink-3:#757e91;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e2e9fd; --bar:#a9bcef;
  --ok:#157a3a; --ok-soft:#daf1e2; --warn:#a35205; --warn-soft:#fcefd6;
  --bad:#b42020; --bad-soft:#fbe1e1; --frz:#475569; --frz-soft:#e5e9ef;
  --nav:#161a22; --nav-2:#1f242e; --nav-ink:#c3c9d5; --nav-ink-2:#7f8797;
  --c-red:#d12a2a; --c-blue:#1f55d6; --c-yellow:#e2a50f; --c-green:#1c9150; --c-black:#2c3038;
  --shadow:0 18px 50px rgba(15,20,32,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14; --surface:#141820; --surface-2:#1a1f29; --line:#252b37;
    --ink:#e7eaf1; --ink-2:#aab1c0; --ink-3:#727a8c;
    --accent:#6b90f7; --accent-ink:#0c0f14; --accent-soft:#1b2644; --bar:#34497f;
    --ok:#5fd28a; --ok-soft:#12291c; --warn:#f2b441; --warn-soft:#2e230d;
    --bad:#f47a7a; --bad-soft:#351516; --frz:#9aa6b8; --frz-soft:#1e2430;
    --nav:#07090d; --nav-2:#12151c; --c-black:#5b6270;
    --shadow:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14; --surface:#141820; --surface-2:#1a1f29; --line:#252b37;
  --ink:#e7eaf1; --ink-2:#aab1c0; --ink-3:#727a8c;
  --accent:#6b90f7; --accent-ink:#0c0f14; --accent-soft:#1b2644; --bar:#34497f;
  --ok:#5fd28a; --ok-soft:#12291c; --warn:#f2b441; --warn-soft:#2e230d;
  --bad:#f47a7a; --bad-soft:#351516; --frz:#9aa6b8; --frz-soft:#1e2430;
  --nav:#07090d; --nav-2:#12151c; --c-black:#5b6270;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;height:100dvh;align-self:start}
.brand{display:flex;gap:11px;align-items:center;padding-inline:8px}
.plate{width:36px;height:36px;border-radius:50%;background:var(--c-blue);position:relative;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.28),inset 0 0 0 7px rgba(255,255,255,.08)}
.plate::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--nav);box-shadow:0 0 0 2px #c9cfdb}
.brand b{display:block;font:700 23px/1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:#fff}
.brand small{display:block;font-size:11.5px;color:var(--nav-ink-2);letter-spacing:.05em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--nav-ink);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--nav-2);color:#fff}
.nav button:focus-visible{outline:2px solid var(--c-yellow)}
.nav button[aria-current="page"]{background:var(--nav-2);color:#fff}
.nav button[aria-current="page"] svg{color:var(--c-yellow)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:12px;color:var(--nav-ink-2);padding-inline:10px;line-height:1.5}

main{min-width:0;padding-block:24px 56px;padding-inline:clamp(16px,3vw,40px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:700 32px/1.05 var(--f-disp);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.top .date{color:var(--ink-3);font-size:13.5px}
.sp{flex:1}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}

/* buttons & fields */
.btn{font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.wa{color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.fld{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;min-width:0}
.fld:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.fld{resize:vertical;min-height:70px}

/* stats & panels */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 13px}
.stat .k{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font:700 40px/1.1 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v.warn{color:var(--warn)}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2{font-size:15px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .c{color:var(--ink-3);font-weight:500;font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:14px 0 6px}
.scroll{max-height:372px;overflow-y:auto;margin-inline:-4px;padding-inline:4px}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--surface-2);color:var(--ink-2);flex:none;font-size:13px;border:1px solid var(--line)}
.av.lg{width:56px;height:56px;font-size:19px}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.01em}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.time{font:600 19px/1 var(--f-disp);font-variant-numeric:tabular-nums;min-width:48px;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.active{background:var(--ok-soft);color:var(--ok)}
.chip.expiring{background:var(--warn-soft);color:var(--warn)}
.chip.expired{background:var(--bad-soft);color:var(--bad)}
.chip.frozen{background:var(--frz-soft);color:var(--frz)}
.plan{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 2.5px rgba(0,0,0,.22)}
.warnt{color:var(--warn)} .badt{color:var(--bad)} .okt{color:var(--ok)}

/* chart & mix */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--ink-3);font:11px var(--f-body)}
.chart .vl{fill:var(--ink-2);font-weight:600}
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) 28px;gap:10px 12px;align-items:center;margin-top:10px;font-size:14px}
.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track span{display:block;height:100%;background:var(--c);border-radius:99px}

/* toolbar & table */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;max-width:420px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg .n{opacity:.65;font-variant-numeric:tabular-nums;margin-inline-start:3px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.cell-m{display:flex;align-items:center;gap:10px}
td.end{text-align:end}

/* check-in */
.ci{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.ci label{display:block;font-weight:600;margin-bottom:10px;color:var(--ink-2)}
.ci-in{font-size:22px;padding:14px 18px;border-radius:10px}
.ci .hint{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.ci-res{display:grid;gap:8px;margin-top:14px}
.ci-card{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.ci-card .big{font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard .head{display:flex;align-items:center;gap:14px}
.disc{width:66px;height:66px;border-radius:50%;background:var(--c);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 0 0 4px rgba(0,0,0,.2),inset 0 0 0 9px rgba(255,255,255,.1)}
.disc span{font:700 20px/1 var(--f-disp);color:#fff;text-align:center}
.disc small{display:block;font:600 10px/1 var(--f-body);opacity:.85;margin-top:2px}
.pcard h3{margin:0;font-size:17px}
.pcard .price{font:700 28px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--ink-3)}

/* schedule */
.ww{overflow-x:auto;padding-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.day{display:flex;flex-direction:column;gap:8px}
.day h3{margin:0;font:700 17px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.day.today h3{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day h3 em{font:600 11px var(--f-body);font-style:normal;opacity:.75}
.cls{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.cls:hover{border-color:var(--ink-3)}
.cls:focus-visible{outline:2px solid var(--accent)}
.cls .t{display:flex;align-items:center;gap:7px;font:600 18px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.cls b{font-size:14px}
.rest{font-size:13px;color:var(--ink-3);padding:10px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,10,16,.55)}
dialog.drawer{margin-block:0;margin-inline:auto 0;height:100dvh;max-height:none;width:min(540px,100%);border-radius:0;display:flex;flex-direction:column}
dialog:not([open]){display:none}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font:700 24px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
.db{padding:18px 20px;overflow-y:auto}
.drawer .db{flex:1}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.summary{grid-column:1/-1;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}

.mhead{display:flex;align-items:center;gap:14px}
.mhead h3{font:600 20px/1.2 var(--f-body);text-transform:none;letter-spacing:0}
.status{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.status .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.status .big{font:700 58px/.9 var(--f-disp);font-variant-numeric:tabular-nums}
.status .lab{font-size:13px;color:var(--ink-3);margin-top:4px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--c)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;margin:16px 0}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;font-weight:500}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin:20px 0 6px}
.visits{display:flex;flex-wrap:wrap;gap:6px}
.visits span{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

#toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:100;padding-inline:16px}
.t{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease-out;max-width:100%}
.t.err{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.t{animation:none}}

/* ---------- motion & polish ---------- */
:root[dir="rtl"]{--slide:-100%}
.btn,.seg button,.nav button,.fld,.s-btn,.cls,.days button{transition:background-color .18s,border-color .18s,color .18s,transform .18s var(--ease),box-shadow .18s,filter .18s}
.btn:active,.s-btn:active,.seg button:active{transform:scale(.97)}
.stat,.pcard{position:relative;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.stat:hover,.pcard:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgba(15,20,32,.4)}
.stat .k{padding-inline-end:38px}
.stat .ico{position:absolute;inset-inline-end:14px;top:14px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.stat .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spark{display:block;width:100%;height:30px;margin-top:6px}
.spk{stroke-dasharray:1;stroke-dashoffset:0}
.plate,.disc{transition:transform .7s var(--ease)}
.brand:hover .plate,.pcard:hover .disc{transform:rotate(180deg)}
.side .foot a{color:var(--nav-ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center;margin-bottom:8px;font-weight:600}
.side .foot a:hover{color:#fff}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes drawl{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes slide{from{transform:translateX(var(--slide))}}
@keyframes flash{0%,30%{background:var(--ok-soft)}}
#view.anim>*{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
#view.anim .chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*35ms + 200ms)}
#view.anim .spk{animation:drawl 1.1s var(--ease) both .3s}
#view.anim .track span,.drawer .meter span{transform-origin:left center;animation:growx .9s var(--ease) both .25s}
[dir="rtl"] #view.anim .track span,[dir="rtl"] .drawer .meter span{transform-origin:right center}
dialog[open]{animation:pop .24s var(--ease)}
dialog.drawer[open]{animation:slide .34s var(--ease)}
dialog[open]::backdrop{animation:fade .25s ease}
.row.new{animation:flash 1.8s ease-out;border-radius:8px}
.t.ok{background:#157a3a;color:#fff;display:flex;gap:10px;align-items:center}
.t.ok svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t.ok path{stroke-dasharray:1;animation:drawl .45s .12s var(--ease) both}

/* ---------- main page (committed dark "gym floor" look) ---------- */
body[data-mode="site"]{background:#101216}
body[data-mode="site"] .shell{display:none}
body[data-mode="app"] #site,body:not([data-mode]) #site{display:none}
#site{--s-bg:#101216;--s-bg2:#171a20;--s-bg3:#1e222a;--s-line:#2a2e37;--s-ink:#f1eee7;--s-ink2:#a9adb6;--s-ink3:#737884;--s-hi:#e8ad16;
  background:var(--s-bg);color:var(--s-ink);min-height:100%;overflow-x:clip;color-scheme:dark}
#site :focus-visible{outline-color:var(--s-hi)}
.s-wrap{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.s-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,18,22,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--s-line)}
.s-nav .s-wrap{display:flex;align-items:center;gap:18px;height:66px}
.s-nav .brand{text-decoration:none;padding:0}
.s-nav .plate::after{background:var(--s-bg)}
.s-links{display:flex;gap:2px}
.s-links a{color:var(--s-ink2);text-decoration:none;padding:6px 11px;border-radius:6px;font-weight:500;font-size:14.5px;transition:color .2s,background-color .2s}
.s-links a:hover{color:var(--s-ink);background:var(--s-bg2)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid var(--s-line);color:var(--s-ink);text-decoration:none;font-weight:600;background:transparent;cursor:pointer;white-space:nowrap;font-size:14.5px;line-height:1.3}
.s-btn:hover{border-color:var(--s-ink2);background:var(--s-bg2)}
.s-btn.pri{background:var(--s-hi);border-color:var(--s-hi);color:#17130a}

const getP = id => S.plans.find(p => p.id === id);
const getT = id => S.trainers.find(x => x.id === id);
function status(m) {
  if (m.frozenSince) return 'frozen';
  const d = diff(today(), m.end);
  return d < 0 ? 'expired' : d <= 7 ? 'expiring' : 'active';
}
const left = m => m.frozenSince ? diff(m.frozenSince, m.end) : diff(today(), m.end);
const canEnter = m => ['active', 'expiring'].includes(status(m));
function leftText(m) {
  const n = left(m), st = status(m);
  if (st === 'frozen') return t('onHold', Math.max(0, n));
  if (n < 0) return t('expAgo', -n);
  if (n === 0) return t('endsToday');
  return t('daysLeft', n);
}
const chip = m => { const s = status(m); return `<span class="chip ${s}">${t('st_' + s)}</span>`; };
const planTag = id => { const p = getP(id); return p ? `<span class="plan"><i class="dot" style="--c:var(--c-${p.color})"></i>${esc(L(p.name))}</span>` : '—'; };
const todayCheckin = m => S.checkins.find(c => c.memberId === m.id && c.date === today());
function lastVisit(m) {
  const c = S.checkins.filter(c => c.memberId === m.id).map(c => c.date).sort().pop();
  if (!c) return `<span class="meta">${t('never')}</span>`;
  const n = diff(c, today());
  return n === 0 ? t('todayW') : n === 1 ? t('yesterday') : t('daysAgo', n);
}
function waLink(m) {

  const p = getP(m.planId), st = status(m);
  const msg = t(st === 'expired' ? 'wa_exp' : 'wa_soon', m.name.split(' ')[0], S.settings.gymName, L(p?.name), fmt(m.end, { day: 'numeric', month: 'long' }));
  return `https://wa.me/${intl}?text=${encodeURIComponent(msg)}`;
}

/* ---------- render ---------- */
function applyLang() {
  const ar = lang() === 'ar';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
}
function render() {
  $('#gym-name').textContent = S.settings.gymName;
  $('#brand-sub').textContent = t('brandSub');
  $('#foot').textContent = t('foot');
  $('#to-site').textContent = t('mainPage');
  $('#nav').innerHTML = VIEWS.map(v => `<button data-act="nav" data-id="${v}" ${ui.view === v ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[v]}</svg><span>${t('nav_' + v)}</span></button>`).join('');

    <span class="sp"></span>${S.demo ? `<span class="demo">${t('demo')}</span>` : ''}
    <button class="btn" data-act="lang">${t('langBtn')}</button>
    ${ui.view !== 'checkin' ? `<button class="btn pri" data-act="nav" data-id="checkin">${t('quickCheckin')}</button>` : ''}`;
  $('#view').innerHTML = ({ dashboard: vDashboard, checkin: vCheckin, members: vMembers, plans: vPlans, classes: vClasses, trainers: vTrainers, payments: vPayments, settings: vSettings })[ui.view]();
  const v = $('#view');
  v.classList.remove('anim');
  if (ui.anim && !RM) {
    [...v.children].forEach((c, i) => c.style.setProperty('--i', i));
    void v.offsetWidth; v.classList.add('anim');
    countUp(v);
  }
  ui.anim = false;
  if (ui.view === 'checkin') { const i = $('#ci-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function renderAll() { ui.mode === 'site' ? renderSite() : render(); }
function refresh() {
  save(); renderAll();
  if ($('#dlg').open && ui.drawer && $('#dlg').classList.contains('drawer')) openMember(ui.drawer);
}
function countUp(root) {
  if (RM) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count), t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  const h = location.hash, desk = h.startsWith('#/desk'), pm = ui.mode, pv = ui.view;
  ui.mode = desk ? 'app' : 'site';
  if (desk) { const v = h.split('/')[2]; if (VIEWS.includes(v)) ui.view = v; }
  ui.anim = pm !== ui.mode || pv !== ui.view;
  document.body.dataset.mode = ui.mode;
  if (dlg.open) closeDlg();
  renderAll();
  window.scrollTo(0, 0);
}

/* dashboard */
function vDashboard() {
  const T = today(), ms = S.members.map(m => ({ m, st: status(m) }));
  const cnt = k => ms.filter(x => x.st === k).length;
  const ciToday = S.checkins.filter(c => c.date === T).sort((a, b) => b.time.localeCompare(a.time));
  const d0 = parse(T), ym = T.slice(0, 7), lym = iso(new Date(d0.getFullYear(), d0.getMonth() - 1, 1)).slice(0, 7);
  const rev = sum(S.payments.filter(p => p.date.startsWith(ym))), revL = sum(S.payments.filter(p => p.date.startsWith(lym)));
  const avg = Math.round(S.checkins.filter(c => diff(c.date, T) >= 1 && diff(c.date, T) <= 14).length / 14);
  const due = ms.filter(x => x.st === 'expiring' || (x.st === 'expired' && diff(x.m.end, T) <= 14)).sort((a, b) => a.m.end.localeCompare(b.m.end));
  const todays = S.classes.filter(c => c.day === d0.getDay()).sort((a, b) => a.time.localeCompare(b.time));
  return `<div class="stats">
      <div class="stat"><span class="ico"><svg viewBox="0 0 24 24">${IC.members}</svg></span><div class="k">${t('stat_active')}</div><div class="v" data-count="${cnt('active') + cnt('expiring')}">${cnt('active') + cnt('expiring')}</div><div class="s">${t('stat_activeSub', S.members.length)}</div></div>
      <div class="stat"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div class="k">${t('stat_exp')}</div><div class="v ${cnt('expiring') ? 'warn' : ''}" data-count="${cnt('expiring')}">${cnt('expiring')}</div><div class="s">${t('stat_expSub', cnt('expired'))}</div></div>
      <div class="stat"><span class="ico"><svg viewBox="0 0 24 24">${IC.checkin}</svg></span><div class="k">${t('stat_ci')}</div><div class="v" data-count="${ciToday.length}">${ciToday.length}</div><div class="s">${t('stat_ciSub', avg)}</div>${spark()}</div>
      <div class="stat"><span class="ico"><svg viewBox="0 0 24 24">${IC.payments}</svg></span><div class="k">${t('stat_rev')}</div><div class="v"><span data-count="${Math.round(rev)}">${Math.round(rev).toLocaleString('en-US')}</span><small style="font-size:16px;margin-inline-start:6px;color:var(--ink-3)">${t('cur')}</small></div><div class="s">${t('stat_revSub', money(revL))}</div></div>
    </div>
    <div class="cols">
      <div class="panel"><h2>${t('p_due')} <span class="c">${due.length}</span></h2>
        <div class="scroll">${due.length ? due.map(({ m }) => `<div class="row">
          <span class="av">${esc(initials(m.name))}</span>

          <div class="acts"><a class="btn sm wa" data-act="noop" href="${waLink(m)}" target="_blank" rel="noopener">${t('whatsapp')}</a><button class="btn sm" data-act="renew" data-id="${m.id}">${t('renew')}</button></div>
        </div>`).join('') : `<div class="empty">${t('p_dueEmpty')}</div>`}</div>
      </div>
      <div class="panel"><h2>${t('p_today')} <span class="c">${ciToday.length}</span></h2>
        <div class="scroll">${ciToday.length ? ciToday.map(c => { const m = getM(c.memberId); return m ? `<div class="row ${c.id === ui.lastCi ? 'new' : ''}">
          <span class="time">${c.time}</span><div class="grow"><div class="name">${esc(m.name)}</div><div class="meta">${planTag(m.planId)}</div></div>
          <button class="btn sm ghost" data-act="openMember" data-id="${m.id}">${chip(m)}</button></div>` : ''; }).join('') : `<div class="empty">${t('p_todayEmpty')}</div>`}</div>

    <div class="cols">
      <div class="panel"><h2>${t('p_chart')}</h2>${chart()}</div>

          ${todays.length ? todays.map(c => `<div class="row"><span class="time">${c.time}</span><i class="dot" style="--c:var(--c-${c.color})"></i><div class="grow"><div class="name">${esc(L(c.name))}</div><div class="meta">${esc(getT(c.trainerId)?.name || '—')}</div></div><span class="meta">${t('seats', c.cap)}</span></div>`).join('') : `<div class="empty">${t('noClassesToday')}</div>`}

function chart() {
  const T = today(), days = [...Array(14)].map((_, i) => addDays(T, i - 13));
  const vals = days.map(d => S.checkins.filter(c => c.date === d).length);
  const mx = Math.max(4, ...vals), step = mx <= 10 ? 2 : mx <= 25 ? 5 : mx <= 60 ? 10 : 20, top = Math.ceil(mx / step) * step;
  const W = 600, H = 220, l = 30, r = 6, tp = 18, b = 34, bw = (W - l - r) / 14, y = v => tp + (H - tp - b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const bars = vals.map((v, i) => {
    const x = l + i * bw + bw * .2, w = bw * .6, isT = i === 13, d = parse(days[i]);
    return `<rect class="b" style="--i:${i}" x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${isT ? 'var(--accent)' : 'var(--bar)'}"/>
      ${v ? `<text class="vl" x="${x + w / 2}" y="${y(v) - 5}" text-anchor="middle">${v}</text>` : ''}
      <text x="${x + w / 2}" y="${H - b + 16}" text-anchor="middle" ${isT ? 'style="fill:var(--ink);font-weight:600"' : ''}>${d.getDate()}</text>
      <text x="${x + w / 2}" y="${H - b + 29}" text-anchor="middle" style="font-size:9.5px">${DAYS[lang()][d.getDay()].slice(0, lang() === 'ar' ? 3 : 2)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="${t('p_chart')}">${g}${bars}</svg>`;
}
function spark() {
  const vals = [...Array(14)].map((_, i) => S.checkins.filter(c => c.date === addDays(today(), i - 13)).length);
  const mx = Math.max(1, ...vals), W = 140, H = 30;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${(i * W / 13).toFixed(1)},${(H - 2 - v / mx * (H - 6)).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W},${H}L0,${H}Z" fill="var(--accent-soft)"/><path class="spk" pathLength="1" d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function planMix() {
  const rows = S.plans.map(p => ({ p, n: S.members.filter(m => m.planId === p.id && ['active', 'expiring'].includes(status(m))).length }));
  const mx = Math.max(1, ...rows.map(x => x.n));
  return `<div class="mix">${rows.map(({ p, n }) => `<span class="plan"><i class="dot" style="--c:var(--c-${p.color})"></i>${esc(L(p.name))}</span><div class="track"><span style="width:${n / mx * 100}%;--c:var(--c-${p.color})"></span></div><b class="num" style="text-align:end">${n}</b>`).join('')}</div>`;
}

/* check-in */
function ciMatches() {
  const q = norm(ui.ciq);
  if (!q) return [];
  const exact = S.members.filter(m => m.id.toLowerCase() === q || m.id.split('-')[1] === q);
  if (exact.length) return exact;
  return S.members.filter(m => norm(m.name).includes(q) || m.phone.includes(q) || m.id.toLowerCase().includes(q)).slice(0, 6);
}
function ciResults() {
  if (!ui.ciq.trim()) return `<div class="hint">${t('ciEmpty')}</div>`;
  const list = ciMatches();
  if (!list.length) return `<div class="empty">${t('ciNone')}</div>`;
  return list.map(m => {
    const st = status(m), c = todayCheckin(m);
    const btn = c ? `<button class="btn" disabled>✓ ${t('checkedAt', c.time)}</button>`
      : st === 'expired' ? `<button class="btn pri" data-act="renew" data-id="${m.id}">${t('renew')}</button>`
        : st === 'frozen' ? `<button class="btn" data-act="unfreeze" data-id="${m.id}">${t('unfreeze')}</button>`
          : `<button class="btn pri" data-act="checkin" data-id="${m.id}">${t('checkin')}</button>`;
    return `<div class="ci-card"><span class="av lg">${esc(initials(m.name))}</span>
      <div class="grow"><div class="name" style="font-size:17px">${esc(m.name)}</div><div class="meta"><span class="mono">${m.id}</span> · ${phone(m.phone)} · ${planTag(m.planId)}</div></div>
      <div>${chip(m)}<div class="meta" style="margin-top:4px">${leftText(m)}</div></div>
      <div class="acts"><button class="btn ghost sm" data-act="openMember" data-id="${m.id}">${t('edit')}</button>${btn}</div></div>`;
  }).join('');
}
function vCheckin() {
  const ci = S.checkins.filter(c => c.date === today()).sort((a, b) => b.time.localeCompare(a.time));
  return `<div class="ci"><label for="ci-q">${t('ciPrompt')}</label>

    </div>`;

/* members */
const ORDER = { expiring: 0, expired: 1, frozen: 2, active: 3 };
function filtered() {
  const q = norm(ui.q);
  return S.members.filter(m => (ui.filter === 'all' || status(m) === ui.filter) && (!q || norm(m.name).includes(q) || m.phone.includes(q) || m.id.toLowerCase().includes(q)))
    .sort((a, b) => ORDER[status(a)] - ORDER[status(b)] || a.end.localeCompare(b.end));
}
function membersTable() {

  return `<div class="tw"><table><thead><tr><th>${t('col_member')}</th><th>${t('col_phone')}</th><th>${t('col_plan')}</th><th>${t('col_ends')}</th><th>${t('col_status')}</th><th>${t('col_last')}</th><th></th></tr></thead><tbody>

/* ---------- main page ---------- */
const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
function fmt12(s) { const [h, m] = s.split(':').map(Number); return `${(h % 12) || 12}:${pad(m)} ${t(h % 24 < 12 ? 'am' : 'pm')}`; }
const hoursFor = d => ({ o: d === 5 ? S.settings.friOpen : S.settings.open, c: S.settings.close });
const span = h => { const o = mins(h.o); let c = mins(h.c); if (c <= o) c += 1440; return [o, c]; };
function openState() {
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes(), h = hoursFor(d.getDay()), [o, c] = span(h);
  if (n >= o && n < c) return { open: true, txt: t('openUntil', fmt12(h.c)) };
  return { open: false, txt: t('opensAt', fmt12(n < o ? h.o : hoursFor((d.getDay() + 1) % 7).o)) };
}
function crowd(open) {
  const n0 = new Date(), now = n0.getHours() * 60 + n0.getMinutes();
  const n = open ? S.checkins.filter(c => c.date === today() && now - mins(c.time) >= 0 && now - mins(c.time) <= 120).length : 0;
  const level = n <= 3 ? 0 : n <= 8 ? 1 : 2;
  return { n, level, lit: open ? Math.max(1, Math.min(10, Math.ceil(n * 10 / 12))) : 0, color: ['#3ccf6e', 'var(--c-yellow)', 'var(--c-red)'][level] };
}
function nextClass() {
  const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  for (let k = 0; k < 7; k++) {
    const day = (d.getDay() + k) % 7;
    const cs = S.classes.filter(c => c.day === day && (k > 0 || mins(c.time) > now)).sort((a, b) => a.time.localeCompare(b.time));
    if (cs.length) return { c: cs[0], k, day };
  }
  return null;
}
function programs() {
  const map = new Map();
  S.classes.forEach(c => {
    const k = (c.name.en || c.name.ar).toLowerCase();
    if (!map.has(k)) map.set(k, { name: c.name, color: c.color, n: 0, days: new Set(), tr: new Set() });
    const p = map.get(k); p.n++; p.days.add(c.day); if (c.trainerId) p.tr.add(c.trainerId);
  });
  return [...map.values()].map(p => ({ ...p, days: WEEK.filter(d => p.days.has(d)), tr: [...p.tr].map(getT).filter(Boolean) }));
}

    <div class="status">
      <div class="top2"><div><div class="big ${bigCls}">${big}</div><div class="lab">${lab}</div></div>
        <div style="text-align:end">${chip(m)}<div style="margin-top:8px">${planTag(m.planId)}</div><div class="meta num" style="margin-top:4px">${fmt(m.start)} – ${fmt(m.end)}</div>${m.frozenSince ? `<div class="meta">${t('m_frozenSince', fmt(m.frozenSince))}</div>` : ''}</div></div>
      <div class="meter"><span style="width:${used / total * 100}%;--c:${st === 'expired' ? 'var(--bad)' : st === 'expiring' ? 'var(--warn)' : `var(--c-${p?.color || 'blue'})`}"></span></div>
      <div class="acts">
        ${ci ? `<button class="btn" disabled>✓ ${t('checkedAt', ci.time)}</button>` : `<button class="btn pri" data-act="checkin" data-id="${id}" ${canEnter(m) ? '' : 'disabled'}>${t('checkin')}</button>`}
        <button class="btn" data-act="renew" data-id="${id}">${t('renew')}</button>
        ${st === 'frozen' ? `<button class="btn" data-act="unfreeze" data-id="${id}">${t('unfreeze')}</button>` : st !== 'expired' ? `<button class="btn" data-act="freeze" data-id="${id}">${t('freeze')}</button>` : ''}
        <a class="btn wa" data-act="noop" href="${waLink(m)}" target="_blank" rel="noopener">${t('whatsapp')}</a>
      </div>
    </div>
    <dl class="dl">
      <dt>${t('m_trainer')}</dt><dd>${esc(getT(m.trainerId)?.name || t('m_none'))}</dd>
      <dt>${t('m_gender')}</dt><dd>${t(m.gender === 'f' ? 'female' : 'male')}</dd>
      <dt>${t('m_joined')}</dt><dd>${fmt(m.joined)}</dd>
      <dt>${t('m_visits30')}</dt><dd class="num">${v30}</dd>
      ${m.notes ? `<dt>${t('m_notes')}</dt><dd>${esc(m.notes)}</dd>` : ''}
    </dl>
    <div class="sec">${t('m_recent')}</div>
    ${visits.length ? `<div class="visits">${visits.slice(0, 12).map(c => `<span class="num">${fmt(c.date, { day: 'numeric', month: 'short' })} · ${c.time}</span>`).join('')}</div>` : `<div class="empty">${t('m_noVisits')}</div>`}
    <div class="sec">${t('m_payments')}</div>
    ${pays.length ? pays.map(x => `<div class="row"><div class="grow"><div>${planTag(x.planId)}</div><div class="meta">${fmt(x.date)} · ${t('pay_' + x.method)}</div></div><b class="num">${money(x.amount)}</b></div>`).join('') : `<div class="empty">${t('m_noPay')}</div>`}
  </div>
  <div class="df"><button class="btn ghost danger" data-act="delMember" data-id="${id}">${t('del')}</button><span class="sp"></span><button class="btn" data-act="editMember" data-id="${id}">${t('edit')}</button></div>`, 'drawer');
}

function memberForm(m) {
  const isNew = !m; m = m || { name: '', phone: '', gender: 'm', trainerId: '', notes: '' };
  show(`${head(t(isNew ? 'newMember' : 'editMember'))}
  <form id="f-member" data-id="${m.id || ''}"><div class="db"><div class="form">
    <label class="full">${t('fm_name')}<input class="fld" id="fm-name" name="name" required value="${esc(m.name)}"></label>
    <label>${t('fm_phone')}<input class="fld" id="fm-phone" name="phone" dir="ltr" required inputmode="tel" pattern="0?1[0125][0-9]{8}" placeholder="01xxxxxxxxx" value="${esc(m.phone)}"></label>
    <label>${t('fm_gender')}<select class="fld" id="fm-gender" name="gender">${opts([['m', t('male')], ['f', t('female')]], m.gender)}</select></label>
    <label class="full">${t('fm_trainer')}<select class="fld" id="fm-trainer" name="trainerId">${trainerOpts(m.trainerId)}</select></label>
    ${isNew ? `<label>${t('fm_plan')}<select class="fld" id="fm-plan" name="planId">${planOpts(S.plans[0]?.id)}</select></label>
    <label>${t('fm_start')}<input class="fld" id="fm-start" type="date" name="start" required value="${today()}"></label>
    <label>${t('fm_method')}<select class="fld" id="fm-method" name="method">${methodOpts()}</select></label>
    <label>${t('fm_discount')}<input class="fld" id="fm-disc" type="number" min="0" step="50" name="discount" value="0"></label>
    <div class="summary" id="sum"></div>` : ''}
    <label class="full">${t('fm_notes')}<textarea class="fld" id="fm-notes" name="notes">${esc(m.notes)}</textarea></label>
  </div></div><div class="df"><button type="button" class="btn" data-act="back">${t('cancel')}</button><button class="btn pri">${t('save')}</button></div></form>`);
  if (isNew) updSummary('f-member');
}
function renewForm(id) {
  const m = getM(id), active = ['active', 'expiring'].includes(status(m));
  const start = active ? addDays(m.end, 1) : today();
  show(`${head(t('renewTitle'))}
  <form id="f-renew" data-id="${id}"><div class="db">
    <div class="row" style="padding-top:0;margin-bottom:14px"><span class="av">${esc(initials(m.name))}</span><div class="grow"><div class="name">${esc(m.name)}</div><div class="meta">${planTag(m.planId)} · ${leftText(m)}</div></div>${chip(m)}</div>
    <div class="form">
      <label class="full">${t('fm_plan')}<select class="fld" id="rn-plan" name="planId">${planOpts(getP(m.planId) ? m.planId : S.plans[0]?.id)}</select></label>
      <label>${t('fm_start')}<input class="fld" id="rn-start" type="date" name="start" required value="${start}"></label>
      <label>${t('fm_method')}<select class="fld" id="rn-method" name="method">${methodOpts()}</select></label>
      <label class="full">${t('fm_discount')}<input class="fld" id="rn-disc" type="number" min="0" step="50" name="discount" value="0"></label>
      <div class="summary" id="sum"></div>
    </div></div>
  <div class="df"><button type="button" class="btn" data-act="back">${t('cancel')}</button><button class="btn pri">${t('renew')}</button></div></form>`);
  updSummary('f-renew');
}
function updSummary(fid) {
  const f = document.getElementById(fid); if (!f) return;
  const fd = Object.fromEntries(new FormData(f)), p = getP(fd.planId), el = $('#sum');
  if (!p || !fd.start || !el) return;
  el.textContent = t('summary', fmt(addDays(fd.start, p.days - 1)), money(Math.max(0, p.price - Number(fd.discount || 0))));
}
function planForm(p) {
  p = p || { name: { ar: '', en: '' }, days: 30, price: 0, color: 'blue' };
  show(`${head(t(p.id ? 'editPlan' : 'addPlan'))}<form id="f-plan" data-id="${p.id || ''}"><div class="db"><div class="form">
    <label>${t('fm_nameAr')}<input class="fld" id="pl-ar" name="ar" required dir="rtl" value="${esc(p.name.ar)}"></label>
    <label>${t('fm_nameEn')}<input class="fld" id="pl-en" name="en" dir="ltr" value="${esc(p.name.en)}"></label>
    <label>${t('fm_days')}<input class="fld" id="pl-days" type="number" min="1" name="days" required value="${p.days}"></label>
    <label>${t('fm_price')}<input class="fld" id="pl-price" type="number" min="0" step="50" name="price" required value="${p.price}"></label>
    <label class="full">${t('fm_color')}<select class="fld" id="pl-color" name="color">${colorOpts(p.color)}</select></label>
  </div></div><div class="df"><button type="button" class="btn" data-act="back">${t('cancel')}</button><button class="btn pri">${t('save')}</button></div></form>`);
}
function classForm(c) {
  const isNew = !c; c = c || { name: { ar: '', en: '' }, day: WEEK[0], time: '18:00', trainerId: S.trainers[0]?.id, cap: 12, color: 'blue' };
  show(`${head(t(isNew ? 'addClass' : 'editClass'))}<form id="f-class" data-id="${c.id || ''}"><div class="db"><div class="form">
    <label>${t('fm_nameAr')}<input class="fld" id="cl-ar" name="ar" required dir="rtl" value="${esc(c.name.ar)}"></label>
    <label>${t('fm_nameEn')}<input class="fld" id="cl-en" name="en" dir="ltr" value="${esc(c.name.en)}"></label>
    <label>${t('fm_day')}<select class="fld" id="cl-day" name="day">${opts(WEEK.map(d => [String(d), DAYS[lang()][d]]), String(c.day))}</select></label>
    <label>${t('fm_time')}<input class="fld" id="cl-time" type="time" name="time" required value="${c.time}"></label>
    <label>${t('fm_trainer')}<select class="fld" id="cl-trainer" name="trainerId">${trainerOpts(c.trainerId)}</select></label>
    <label>${t('fm_cap')}<input class="fld" id="cl-cap" type="number" min="1" name="cap" required value="${c.cap}"></label>
    <label class="full">${t('fm_color')}<select class="fld" id="cl-color" name="color">${colorOpts(c.color)}</select></label>
  </div></div><div class="df">${isNew ? '' : `<button type="button" class="btn ghost danger" data-act="delClass" data-id="${c.id}">${t('del')}</button><span class="sp"></span>`}<button type="button" class="btn" data-act="back">${t('cancel')}</button><button class="btn pri">${t('save')}</button></div></form>`);
}
function trainerForm(x) {
  x = x || { name: '', spec: { ar: '', en: '' }, phone: '' };
  show(`${head(t(x.id ? 'editTrainer' : 'addTrainer'))}<form id="f-trainer" data-id="${x.id || ''}"><div class="db"><div class="form">
    <label class="full">${t('fm_name')}<input class="fld" id="tr-name" name="name" required value="${esc(x.name)}"></label>
    <label>${t('fm_specAr')}<input class="fld" id="tr-ar" name="ar" dir="rtl" value="${esc(x.spec.ar)}"></label>
    <label>${t('fm_specEn')}<input class="fld" id="tr-en" name="en" dir="ltr" value="${esc(x.spec.en)}"></label>
    <label class="full">${t('fm_phone')}<input class="fld" id="tr-phone" name="phone" dir="ltr" inputmode="tel" value="${esc(x.phone)}"></label>
  </div></div><div class="df"><button type="button" class="btn" data-act="back">${t('cancel')}</button><button class="btn pri">${t('save')}</button></div></form>`);
}
function confirmBox(msg, fn) {
  ui.confirmFn = fn;
  show(`<div class="db" style="padding-top:22px;font-size:15.5px;line-height:1.6">${esc(msg)}</div><div class="df"><button class="btn" data-act="back">${t('cancel')}</button><button class="btn pri" data-act="confirmYes">${t('yes')}</button></div>`);
}

/* ---------- toast ---------- */
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 't' + (kind === true ? ' err' : kind ? ' ' + kind : '');
  if (kind === 'ok') el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  el.append(msg);
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 3200);
}

/* ---------- actions ---------- */
function checkIn(id) {
  const m = getM(id); if (!m) return;
  const st = status(m), c = todayCheckin(m), first = m.name.split(' ')[0];
  if (c) return toast(t('t_already', first, c.time));
  if (st === 'expired') return toast(t('t_expired', first), true);
  if (st === 'frozen') return toast(t('t_frozen', first), true);
  const time = nowTime();
  const cid = uid();
  S.checkins.push({ id: cid, memberId: id, date: today(), time });
  ui.ciq = ''; ui.lastCi = cid;
  setTimeout(() => { if (ui.lastCi === cid) ui.lastCi = null; }, 2000);
  toast(t('t_checked', m.name, time), 'ok');
  refresh();
}
const A = {
  nav: id => go('#/desk/' + id),
  site: (id, el, e) => { e.preventDefault(); go('#/'); },
  desk: () => go('#/desk/' + ui.view),
  go: (id, el, e) => { e.preventDefault(); document.getElementById(id)?.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); },
  siteDay: (id, el) => {
    ui.siteDay = +id;
    el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b === el));
    $('#slots').innerHTML = slots();
  },
  lang: () => { S.settings.lang = lang() === 'ar' ? 'en' : 'ar'; applyLang(); refresh(); },
  filter: id => { ui.filter = id; render(); },
  noop: () => { },
  back: () => back(),
  openMember: id => openMember(id),
  addMember: () => { ui.drawer = null; memberForm(); },
  editMember: id => memberForm(getM(id)),
  checkin: id => checkIn(id),
  renew: id => renewForm(id),
  freeze: id => { const m = getM(id); m.frozenSince = today(); toast(t('t_frozenOk', m.name)); refresh(); },
  unfreeze: id => {
    const m = getM(id), n = Math.max(0, diff(m.frozenSince, today()));
    m.end = addDays(m.end, n); m.frozenSince = null; toast(t('t_unfrozen', n)); refresh();
    if (ui.view === 'checkin') $('#ci-results').innerHTML = ciResults();
  },
  delMember: id => { const m = getM(id); confirmBox(t('delMemberQ', m.name), () => { S.members = S.members.filter(x => x.id !== id); S.checkins = S.checkins.filter(c => c.memberId !== id); ui.drawer = null; closeDlg(); toast(t('t_deleted')); refresh(); }); },
  addPlan: () => { ui.drawer = null; planForm(); },
  editPlan: id => { ui.drawer = null; planForm(getP(id)); },
  delPlan: id => {
    const p = getP(id), n = S.members.filter(m => m.planId === id && status(m) !== 'expired').length;
    if (n) return toast(t('t_planInUse', n), true);
    confirmBox(t('delPlanQ', L(p.name)), () => { S.plans = S.plans.filter(x => x.id !== id); closeDlg(); toast(t('t_deleted')); refresh(); });
  },
  addClass: () => { ui.drawer = null; classForm(); },
  editClass: id => { ui.drawer = null; classForm(S.classes.find(c => c.id === id)); },
  delClass: id => { const c = S.classes.find(x => x.id === id); confirmBox(t('delClassQ', L(c.name)), () => { S.classes = S.classes.filter(x => x.id !== id); closeDlg(); toast(t('t_deleted')); refresh(); }); },
  addTrainer: () => { ui.drawer = null; trainerForm(); },
  editTrainer: id => { ui.drawer = null; trainerForm(getT(id)); },
  delTrainer: id => {
    const x = getT(id);
    confirmBox(t('delTrainerQ', x.name), () => {
      S.trainers = S.trainers.filter(y => y.id !== id);
      S.members.forEach(m => { if (m.trainerId === id) m.trainerId = null; });
      S.classes.forEach(c => { if (c.trainerId === id) c.trainerId = null; });
      closeDlg(); toast(t('t_deleted')); refresh();
    });
  },
  confirmYes: () => { const f = ui.confirmFn; ui.confirmFn = null; f && f(); },
  resetDemo: () => confirmBox(t('resetQ'), () => { S = seed(); closeDlg(); ui.view = 'dashboard'; refresh(); }),
  clearAll: () => confirmBox(t('clearQ'), () => { S.members = []; S.checkins = []; S.payments = []; S.demo = false; closeDlg(); toast(t('t_deleted')); refresh(); }),
};
const FORMS = {
  'f-member': (d, id) => {
    const base = { name: d.name.trim(), phone: d.phone.trim(), gender: d.gender, trainerId: d.trainerId || null, notes: d.notes.trim() };
    if (id) { Object.assign(getM(id), base); toast(t('t_saved')); refresh(); return openMember(id); }
    const p = getP(d.planId), mid = 'IH-' + (S.seq++);
    const m = { id: mid, ...base, joined: d.start, planId: p.id, start: d.start, end: addDays(d.start, p.days - 1), frozenSince: null };
    S.members.push(m);
    S.payments.push({ id: uid(), memberId: mid, memberName: m.name, planId: p.id, amount: Math.max(0, p.price - Number(d.discount || 0)), method: d.method, date: today() });
    toast(t('t_added', m.name, mid)); ui.view = 'members'; ui.filter = 'all'; ui.q = '';
    refresh(); openMember(mid);
  },
  'f-renew': (d, id) => {
    const m = getM(id), p = getP(d.planId);
    m.planId = p.id; m.start = d.start; m.end = addDays(d.start, p.days - 1); m.frozenSince = null;
    S.payments.push({ id: uid(), memberId: id, memberName: m.name, planId: p.id, amount: Math.max(0, p.price - Number(d.discount || 0)), method: d.method, date: today() });
    toast(t('t_renewed', m.name, fmt(m.end)));
    ui.ciq = ''; refresh(); back();
  },
  'f-plan': (d, id) => {
    const v = { name: { ar: d.ar.trim(), en: d.en.trim() || d.ar.trim() }, days: +d.days, price: +d.price, color: d.color };
    if (id) Object.assign(getP(id), v); else S.plans.push({ id: 'p' + uid(), ...v });
    closeDlg(); toast(t('t_saved')); refresh();
  },
  'f-class': (d, id) => {
    const v = { name: { ar: d.ar.trim(), en: d.en.trim() || d.ar.trim() }, day: +d.day, time: d.time, trainerId: d.trainerId || null, cap: +d.cap, color: d.color };
    if (id) Object.assign(S.classes.find(c => c.id === id), v); else S.classes.push({ id: uid(), ...v });
    closeDlg(); toast(t('t_saved')); refresh();
  },
  'f-trainer': (d, id) => {
    const v = { name: d.name.trim(), spec: { ar: d.ar.trim(), en: d.en.trim() || d.ar.trim() }, phone: d.phone.trim() };
    if (id) Object.assign(getT(id), v); else S.trainers.push({ id: 't' + uid(), ...v });
    closeDlg(); toast(t('t_saved')); refresh();
  },
  'f-settings': d => {
    Object.assign(S.settings, { gymName: d.gymName.trim() || 'Iron House', lang: d.lang, phone: d.phone.trim(), address: d.address.trim(), open: d.open, close: d.close, friOpen: d.friOpen }); applyLang(); toast(t('t_saved')); refresh(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = FORMS[f.id];
  if (fn) fn(Object.fromEntries(new FormData(f)), f.dataset.id);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'm-q') { ui.q = el.value; $('#m-list').innerHTML = membersTable(); }
  else if (el.id === 'ci-q') { ui.ciq = el.value; $('#ci-results').innerHTML = ciResults(); }
  else if (el.id === 'pay-month') { ui.payMonth = el.value; render(); }
  else if (el.closest('#f-renew')) updSummary('f-renew');
  else if (el.closest('#f-member')) updSummary('f-member');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ci-q') {
    const l = ciMatches();
    if (l.length === 1) { e.preventDefault(); const m = l[0]; canEnter(m) ? checkIn(m.id) : status(m) === 'expired' ? renewForm(m.id) : toast(t('t_frozen', m.name.split(' ')[0]), true); }
  }
});
dlg.addEventListener('close', () => { ui.drawer = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

/* ---------- boot ---------- */
S = load();
S.settings = { ...DEF_SETTINGS, ...S.settings };
applyLang();
window.addEventListener('hashchange', route);
route();
</script>
